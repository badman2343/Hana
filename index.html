<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HANA BAGs & Dresses - Style for Everyone</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#fffaf7}
header{position:fixed;top:0;width:100%;background:rgba(255,255,255,0.96);padding:14px 5%;display:flex;justify-content:space-between;align-items:center;z-index:1000;box-shadow:0 2px 15px rgba(0,0,0,.06);backdrop-filter:blur(10px)}
.logo{font-family:'Playfair Display',serif;font-weight:700;font-size:24px;letter-spacing:2px}.logo span{color:#c69c6d}
nav a{margin-left:18px;text-decoration:none;color:#222;font-weight:600;font-size:13px}
.btn{background:#111;color:#fff;padding:12px 28px;border-radius:30px;text-decoration:none;font-weight:700;display:inline-block;border:none;cursor:pointer}
.hero{display:flex;min-height:92vh;padding-top:70px;background:#fdf6ef}
.hero-left{flex:1;padding:50px 5%;display:flex;flex-direction:column;justify-content:center}
.hero-left h1{font-family:'Playfair Display',serif;font-size:58px;line-height:.95;color:#111}.hero-left h1 span{color:#c69c6d;font-style:italic}
.hero-right{flex:1.1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:20px}
.hero-right img{width:100%;height:100%;object-fit:cover;border-radius:20px}
.hero-right img:nth-child(1){grid-row:span 2}
.section{padding:70px 5%}
.section-title{font-family:'Playfair Display',serif;font-size:40px;text-align:center}.section-title span{color:#c69c6d}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:35px}
.card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.06);transition:.3s}.card:hover{transform:translateY(-8px)}
.card img{width:100%;height:330px;object-fit:cover}
.card-body{padding:16px}.price{color:#c69c6d;font-weight:800;font-size:17px;margin:5px 0}
.stars{color:#ffb400;font-size:12px}
.contact{background:#111;color:#fff;text-align:center;padding:80px 5%}
.contact form{max-width:540px;margin:30px auto;background:#fff;padding:28px;border-radius:20px;text-align:left}
.contact input,.contact select,.contact textarea{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:12px;color:#222}
.contact label{color:#111;font-weight:600;font-size:13px;display:block;margin-top:8px}
@media(max-width:900px){.hero{flex-direction:column}.hero-left h1{font-size:38px}.hero-right{height:500px}}
</style>
</head>
<body>
<header>
<div class="logo">HANA <span>BAGs & Dresses</span></div>
<nav><a href="#women">B
